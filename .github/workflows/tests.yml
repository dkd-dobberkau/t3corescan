name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The scanner sits on @internal Core classes. A monthly run notices a broken
  # contract even when nobody touches this repository.
  schedule:
    - cron: '0 4 1 * *'

jobs:
  functional:
    name: TYPO3 ${{ matrix.typo3 }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both lines require php ^8.2 and both ship the same ExtensionScanner
        # classes; the matrix is what keeps that claim honest.
        typo3: ['^13.4', '^14.3']
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies for TYPO3 ${{ matrix.typo3 }}
        run: |
          composer update --no-interaction --no-progress \
            --with typo3/cms-core:${{ matrix.typo3 }} \
            --with typo3/cms-install:${{ matrix.typo3 }}
          # Print what actually got resolved, so the log says which line ran.
          composer show | grep -E '^typo3/(cms-core|cms-install|testing-framework) '

      # The functional tests boot a full TYPO3 via typo3/testing-framework on
      # SQLite, so no database service is needed.
      - name: Run functional tests
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations
